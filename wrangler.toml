# Cloudflare Workers + D1 (SQLite)
# 1) Crie o banco: npx wrangler d1 create semijoias
# 2) Copie o database_id abaixo
# 3) Migração local: npm run db:migrate:local
# 4) Migração produção: npm run db:migrate:remote

name = "semijoias"
compatibility_date = "2026-04-20"
compatibility_flags = ["nodejs_compat"]

# Com Worker + ASSETS, o edge pode responder 404 nas rotas HTML antes de invocar
# o script. `run_worker_first` faz o Astro (SSR) rodar em toda requisição; o
# handler usa env.ASSETS para CSS/JS/arquivos públicos quando precisar.
# https://developers.cloudflare.com/workers/static-assets/routing/worker-script/
[assets]
run_worker_first = true

# Não defina `main` aqui: o @cloudflare/vite-plugin valida o caminho antes do
# `astro build` criar dist/. Deploy (CI ou local): use o wrangler gerado em
# dist/server/wrangler.json — ver script "deploy" no package.json.

[[d1_databases]]
binding = "DB"
database_name = "semijoias"
database_id = "fa603ce2-06d7-4ea3-8cfd-cabb80214420"

# Sessões Astro (@astrojs/cloudflare); sem id o deploy tenta criar "semijoias-session" de novo (erro 10014).
[[kv_namespaces]]
binding = "SESSION"
id = "34f13d35127245719fc22bad1e9e0a2c"

# Admin: ADMIN_PATH_SEGMENT pode ficar em [vars]. Para login em produção defina
# também segredos (Dashboard → Variables → Encrypt ou `wrangler secret put`):
#   ADMIN_SESSION_SECRET — string longa aleatória (HMAC do cookie de sessão)
#   ADMIN_USER, ADMIN_PASSWORD — credenciais (em dev usam padrão; em prod ficam vazias sem isso)
#
# Variáveis públicas (não coloque senhas aqui em produção — use wrangler secret)
[vars]
ADMIN_PATH_SEGMENT = "admpainelmanager"
# DDD + número, só dígitos (ex.: 5519995573316). Usado no link wa.me do checkout.
PUBLIC_WHATSAPP_NUMBER = "5519995573316"
